name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The derivation needs nothing but Node. A model that stops agreeing with
      # itself doesn't ship.
      - run: node tools/horn-check.mjs
      # No build: the app is these files as they sit in the repo. Only they go
      # out, so the tools, docs and screenshots aren't served alongside it.
      - run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
